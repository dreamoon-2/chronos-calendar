name: Publish Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag, for example v0.3.0'
        required: true
        type: string

concurrency:
  group: desktop-release-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate release inputs
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'A stable version tag is required' }
          if ($env:HAS_SIGNING_KEY -ne 'true') { throw 'Missing GitHub Actions secret: TAURI_SIGNING_PRIVATE_KEY' }
          foreach ($name in @('VITE_SUPABASE_URL', 'VITE_SUPABASE_PUBLISHABLE_KEY')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing GitHub Actions secret: $name" }
          }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -ne "v$($package.version)" -or $config.version -ne $package.version) { throw 'Tag and application versions differ' }
      - name: Prepare Rust
        run: rustup update stable
      - name: Install dependencies
        run: npm ci
      - name: Check code
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build signed Windows installer
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build
      - name: Verify signed installer and reject tampering
        run: npm run release:verify
      - name: Generate updater feed
        run: npm run release:prepare
      - name: Publish release and updater feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $asset = "release/Chronos-Calendar_$($package.version)_x64-setup.exe"
          gh release create $env:RELEASE_TAG $asset "$asset.sig" release/latest.json --verify-tag --title "Chronos Calendar v$($package.version)" --notes-file release/release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
