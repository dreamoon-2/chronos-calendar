name: Publish Windows and Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag, for example v0.3.1'
        required: true
        type: string

concurrency:
  group: desktop-release-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate release inputs
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'A stable version tag is required' }
          if ($env:HAS_SIGNING_KEY -ne 'true') { throw 'Missing GitHub Actions secret: TAURI_SIGNING_PRIVATE_KEY' }
          $androidSecrets = @{
            ANDROID_KEYSTORE_BASE64 = $env:HAS_ANDROID_KEYSTORE
            ANDROID_KEYSTORE_PASSWORD = $env:HAS_ANDROID_STORE_PASSWORD
            ANDROID_KEY_ALIAS = $env:HAS_ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD = $env:HAS_ANDROID_KEY_PASSWORD
          }
          foreach ($name in $androidSecrets.Keys) {
            if ($androidSecrets[$name] -ne 'true') { throw "Missing GitHub Actions secret: $name" }
          }
          foreach ($name in @('VITE_SUPABASE_URL', 'VITE_SUPABASE_PUBLISHABLE_KEY')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing GitHub Actions secret: $name" }
          }
          $package = Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json
          $config = Get-Content src-tauri/tauri.conf.json -Raw -Encoding utf8 | ConvertFrom-Json
          if ($env:RELEASE_TAG -ne "v$($package.version)" -or $config.version -ne $package.version) { throw 'Tag and application versions differ' }
          $androidConfig = Get-Content android/app/build.gradle -Raw -Encoding utf8
          if ($androidConfig -notmatch 'versionName "([^"]+)"' -or $Matches[1] -ne $package.version) { throw 'Android and application versions differ' }
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The legacy 'tools' package is no longer available from sdkmanager.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools and configure Gradle download
        shell: pwsh
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed' }
          # CI uses the official distribution; local builds retain the configured mirror.
          $wrapperFile = 'android/gradle/wrapper/gradle-wrapper.properties'
          $wrapper = Get-Content $wrapperFile -Raw -Encoding utf8
          $wrapper = $wrapper -replace '(?m)^distributionUrl=.*$', 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip'
          $wrapper = $wrapper -replace '(?m)^validateDistributionUrl=.*$', 'validateDistributionUrl=true'
          $wrapper += "`ndistributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531`n"
          Set-Content -LiteralPath $wrapperFile -Value $wrapper -Encoding utf8
      - name: Prepare Rust
        run: rustup update stable
      - name: Install dependencies
        run: npm ci
      - name: Check code
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build Android web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:cap
      - name: Sync Android project
        run: npm run mobile:sync
      - name: Restore original Android signing keystore
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $keystoreFile = Join-Path $env:RUNNER_TEMP 'chronos-release.keystore'
          [IO.File]::WriteAllBytes($keystoreFile, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
      - name: Build signed Android APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/chronos-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          .\android\gradlew.bat -p android assembleRelease --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { throw 'Android release build failed' }
      - name: Verify APK version and original signing certificate
        run: npm run android:prepare
      - name: Build signed Windows installer
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build
      - name: Verify signed installer and reject tampering
        run: npm run release:verify
      - name: Prepare Windows and Android release assets
        run: npm run release:prepare
      - name: Publish release and updater feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json
          $asset = "release/Chronos-Calendar_$($package.version)_x64-setup.exe"
          $apk = "release/Chronos-Calendar_$($package.version)_android.apk"
          foreach ($file in @($asset, "$asset.sig", 'release/latest.json', $apk)) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing release asset: $file" }
          }
          gh release create $env:RELEASE_TAG $asset "$asset.sig" release/latest.json $apk --verify-tag --title "Chronos Calendar v$($package.version)" --notes-file release/release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Remove temporary Android keystore
        if: always()
        shell: pwsh
        run: |
          $keystoreFile = Join-Path $env:RUNNER_TEMP 'chronos-release.keystore'
          if (Test-Path -LiteralPath $keystoreFile) { Remove-Item -LiteralPath $keystoreFile -Force }
